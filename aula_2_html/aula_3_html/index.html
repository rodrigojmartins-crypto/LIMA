<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">

    <title>Document</title>
</head>
<body>

        <section>
            <p style="color: blue;">Texto em uma cor especifica</p>

        <section>
            <img src="assets/formula_1.jpg
            " alt="Teste" title="Teste">

        </section>

        <section>

            background-position: center;">

                <p>esta seção tem uma imagem de fundo</p>

                seu navegador não suporta o elemento de video 
            </video>
