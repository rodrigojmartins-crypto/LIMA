<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formatação de links</title>

    <style>
        body{
        background-color: black;
    }
    h1 {
        color:hotpink;
    }
    a:link {
        color: blue;
        text-decoration: none;
    }
    a:visited {
        color: yellow;
    }
    a:hover {
        color: red;
        text-decoration: underline;
        font-size: 21px;
    }
    a:active {
        color: orange;
    }
</style>
</head>

<body>
    <h1>formatação de links CSS</h1>
    <p><a href="######">formatação de links</a></p>
    
</body>
</html>
